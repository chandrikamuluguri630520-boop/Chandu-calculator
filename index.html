 <!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chandu Calculator</title>

<link rel="apple-touch-icon" href="icon.png">

<style>
body{margin:0;background:#111;display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif}
.calc{background:#222;padding:20px;border-radius:20px;width:280px;box-shadow:0 0 20px #000}
#display{width:100%;height:60px;font-size:32px;text-align:right;border:none;border-radius:10px;margin-bottom:15px;padding:10px;box-sizing:border-box;background:#000;color:#0f0}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{height:60px;font-size:22px;border:none;border-radius:12px;background:#333;color:white}
button:active{background:#555}
.op{background:orange}
.equal{background:green}
.clear{background:red}
</style>
</head>
<body>
<div class="calc">
<input id="display" readonly>
<div class="btns">
<button class="clear" onclick="c()">C</button>
<button onclick="v('/')">/</button>
<button onclick="v('*')">*</button>
<button onclick="b()">⌫</button>
<button onclick="v('7')">7</button>
<button onclick="v('8')">8</button>
<button onclick="v('9')">9</button>
<button class="op" onclick="v('-')">-</button>
<button onclick="v('4')">4</button>
<button onclick="v('5')">5</button>
<button onclick="v('6')">6</button>
<button class="op" onclick="v('+')">+</button>
<button onclick="v('1')">1</button>
<button onclick="v('2')">2</button>
<button onclick="v('3')">3</button>
<button class="equal" onclick="e()">=</button>
<button onclick="v('0')" style="grid-column:span 2">0</button>
<button onclick="v('.')">.</button>
<button onclick="v('%')">%</button>
</div>
</div>
<script>
let d=document.getElementById('display');
function v(x){d.value+=x}
function c(){d.value=''}
function b(){d.value=d.value.slice(0,-1)}
function e(){try{d.value=eval(d.value)}catch{d.value='Error'}}
</script>
</body>
                                       </html>
